name: Client control checks

on:
  pull_request:
    paths:
      - app.py
      - xui_report.py
      - maxplayer_report.py
      - maxplayer_cleanup.py
      - maxplayer_cleanup_routes.py
      - integration_credentials.py
      - requirements.txt
      - templates/index.html
      - static/control.*
      - static/xui-report.*
      - static/maxplayer-report.*
      - scripts/snapshot_payment_history.py
      - tests/**
      - .github/workflows/control-checks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fenix_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FENIX_PG_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5432/fenix_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check syntax and data preservation on SQLite and Postgres
        run: |
          python -m py_compile app.py scripts/snapshot_payment_history.py
          node --check static/control.js
          python -m unittest discover -s tests -v
      - name: Check desktop and mobile workflows with synthetic data
        run: |
          python tests/test_control.py --preview > /tmp/fenix-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5058/login > /dev/null; then break; fi
            sleep 1
          done
          node tests/control_browser.cjs
      - name: Upload synthetic preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-control-preview
          path: outputs/revision_2026-11-09/despues/
          if-no-files-found: ignore
