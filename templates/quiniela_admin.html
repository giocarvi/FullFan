<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscripciones Quiniela | Fénix</title><link rel="stylesheet" href="{{ url_for('static', filename='quiniela.css') }}"></head>
<body><header class="topbar"><div class="topbar-inner"><a class="brand" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='logo.png') }}" alt="Fénix Digital TV"></a><a class="top-link" href="{{ url_for('index') }}">Volver a la plataforma</a></div></header>
<main class="admin-wrap"><div class="admin-head"><div><span class="eyebrow" style="color:#b45309;background:#fff7ed">Control interno</span><h1>Inscripciones de la quiniela</h1><p style="color:#64748b">Revisa comprobantes, aprueba pagos y comparte accesos.</p></div><a class="btn btn-secondary" href="{{ url_for('quiniela_home') }}" target="_blank">Ver página pública</a></div>
<div class="filters"><button class="filter active" data-status="">Todas</button><button class="filter" data-status="pending">Pendientes</button><button class="filter" data-status="approved">Aprobadas</button><button class="filter" data-status="rejected">Rechazadas</button></div><div id="list" class="entry-list"><div class="admin-card empty">Cargando inscripciones…</div></div></main>
<script>
let current='';const list=document.getElementById('list');const labels={pending:'Pendiente',approved:'Aprobada',rejected:'Rechazada'};
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.status;load()});
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){const r=await fetch('/api/quiniela/inscripciones'+(current?'?status='+current:''));const d=await r.json();if(!d.entries?.length){list.innerHTML='<div class="admin-card empty">No hay inscripciones en este estado.</div>';return}list.innerHTML=d.entries.map(e=>`<article class="admin-card entry"><div><span class="badge ${e.status}">${labels[e.status]||e.status}</span><h3>${esc(e.nombre)}</h3><p>${esc(e.telefono)}${e.email?' · '+esc(e.email):''}</p><p>Código ${esc(e.public_code)} · Q${Number(e.payment_amount).toFixed(2)}</p></div><div><strong>Enviada</strong><p>${esc((e.created_at||'').replace('T',' ').slice(0,16))}</p></div><div><a class="btn btn-secondary" target="_blank" href="/api/quiniela/inscripciones/${e.id}/comprobante">Ver comprobante</a></div><div class="actions">${e.status!=='approved'?`<button class="btn btn-green" onclick="setStatus(${e.id},'approved')">Aprobar</button>`:''}${e.status!=='rejected'?`<button class="btn btn-red" onclick="setStatus(${e.id},'rejected')">Rechazar</button>`:''}${e.status==='approved'?`<button class="btn btn-secondary" onclick="share('${esc(e.nombre)}','${esc(e.telefono)}','${esc(e.status_url)}')">Enviar acceso</button>`:''}</div></article>`).join('')}
async function setStatus(id,status){let reason='';if(status==='rejected'){reason=prompt('Motivo del rechazo:')||'';if(!reason)return}const r=await fetch(`/api/quiniela/inscripciones/${id}/estado`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status,reason})});const d=await r.json();if(!r.ok){alert(d.error||'No fue posible actualizar');return}if(status==='approved'){await navigator.clipboard?.writeText(d.status_url);alert('Pago aprobado. El enlace de seguimiento fue copiado; allí el participante verá su acceso.')}load()}
function share(nombre,telefono,url){const text=`Hola ${nombre}, validamos tu pago de Q10 para la Quiniela Bimestral Fénix ✅\n\nIngresa a tu enlace personal para participar:\n${url}\n\nNo compartas este enlace.`;window.open(`https://wa.me/${telefono}?text=${encodeURIComponent(text)}`,'_blank')}
load();
</script></body></html>
